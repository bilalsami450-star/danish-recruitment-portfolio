 digital:{slug:'digital-agency',kicker:'Case Study 01',title:'Digital Agency Recruitment',subtitle:'Multi-function hiring across web, growth, creative and client-facing teams.',client:'O8',location:'Minneapolis, MN / USA',facts:[['Client','Digital agency'],['Hiring scope','16 roles'],['Engagement','8 months'],['Outcome','28 hires']],stats:[['28','Hires'],['16','Roles'],['8','Months'],['4','Role families']],challenge:'O8 needed different recruiting logic for developers, marketers, creatives, project managers and client-facing hires. The role changed, so the evidence behind a good candidate had to change with it.',steps:[['Define role evidence','Translate each brief into role-specific proof: shipped work for web roles, campaign execution for growth, portfolio judgment for creative, and client communication for delivery roles.'],['Search beyond titles','Use adjacent titles and context signals instead of relying on a single keyword match.'],['Keep parallel searches distinct','Track candidates by role, stage and review notes so multiple searches stay visible and comparable.'],['Interview for ownership','Use structured questions to establish what the candidate personally owned, delivered and communicated.']],roles:['Developers','Backend Engineer','UI/UX Designers','SEO Strategists','Marketing Manager','Social Media Campaign Manager','Creative Writers','Graphic Designers','Video Editors','Content Creators','Project Managers','Client Account Managers','Notion Workspace Manager','Executive VA','HR Manager','Lead Delivery Manager'],pipeline:[['M01','Marketing Manager','Atlanta, GA','Rejected'],['M03','Marketing Manager','Dallas, TX','Interview Scheduled'],['M04','Content Marketing Manager','Jacksonville, FL','Phone Screen'],['M09','Performance Marketing Manager','Chicago, IL','Technical Interview'],['M10','Integrated Marketing Manager','Jacksonville, FL','Final Round'],['M20','Marketing Strategy Manager','Las Vegas, NV','Background Check']],pipelineCols:['ID','Current title',  tech:{slug:'technology',kicker:'Case Study 02',title:'Technology & AI Recruitment',subtitle:'Software engineering search where project evidence mattered more than the title.',client:'Tech Returners',location:'Manchester / UK',facts:[['Organization','Tech Returners'],['Featured search','Senior Software Engineer'],['Focus','AI & Robotics'],['Outcome','1 hire']],stats:[['35','Documented profiles'],['22','Anonymized rows'],['1','Hire recorded'],['AI/ML','Search focus']],challenge:'The brief combined general software engineering capability with applied AI/ML. Python on a profile was not enough; useful signal came from the projects, product exposure and technical work behind it.',steps:[['Map the brief','Turn software stack, Python and AI/ML requirements into a clear search brief.'],['Source for product evidence','Look for engineers with relevant product, ML, robotics or systems exposure.'],['Review the work behind the title','Use project evidence and technical signals before presenting a shortlist.'],['Keep fit and stage visible','Track technical review signals alongside candidate stage so the client can see why each profile is in the pipeline.']],roles:['Software Engineer','Senior Software Engineer','Machine Learning Engineer','AI/ML Engineer','Robotics Engineer','Computer Vision Engineer','Principal Engineer'],pipeline:[['T01','Machine Learning Eng / Researcher','20+','LLMs / GenAI / CV','Contacted'],['T03','Sr Software Engineer','5+','Best fit','Hired'],['T06','Senior Machine Learning Engineer','11+','Strong fit','Interviewing'],['T09','Founding Engineer','10+','AI/ML / Rust / product','Interested'],['T15','Software Consultant','10+','Rust / C++ / AI','Interviewing'],['T19','Sr Robotics & Control Software Eng','6+','Good fit','Not Interested']],pipelineCols:['ID','Current title','Exp.','Review signal','Stage'],note:'Selected anonymized rows from the documented tracker. Technical notes are condensed for portfolio presentation.'},

c view uses evidence fields rather than presenting those sample stages as historical outcomes.'},

 federal:{slug:'federal-defense',kicker:'Case Study 05',title:'Federal & Defense Recruitment',subtitle:'Cleared cybersecurity hiring where eligibility opens the search and engineering evidence earns the shortlist.',client:'Harrington Technology & Associates',location:'United States',facts:[['Featured search','ISSE'],['Client context','U.S. federal support'],['Clearance','Secret / Top Secret'],['Outcome','1 hire']],stats:[['250+','Profiles sourced'],['50+','Interviews'],['1','Hire'],['S / TS','Clearance scope']],challenge:'A cleared profile still needed evidence of hands-on systems security engineering. Clearance was an eligibility gate, not a substitute for role fit.',steps:[['Check eligibility first','Identify candidates aligned with the required Secret or Top Secret clearance scope.'],['Review engineering evidence','Look for hands-on ISSE and systems security engineering experience.'],['Validate role and program fit','Confirm the technical scope before candidate submission.'],['Write decision-ready notes','Explain evidence seen, open questions and the recommended next step.']],roles:['Information Systems Security Engineer','Cloud Security ISSE','Network Security ISSE','Information Assurance Engineer','Systems Security Engineer','Cybersecurity & Compliance'],pipeline:[['IS-01','ISSE','6 years','Secret','VA','Phone Screen'],['IS-02','ISSE - Cloud Security','10 years','Top Secret','VA','Final Round'],['IS-04','ISSE - Network Security','10 years','Top Secret','VA','Hired'],['IS-07','ISSE','8 years','Secret','MD','Offer Extended'],['IS-10','ISSE - Zero Trust Architecture','9 years','Secret','MD','Technical Interview'],['IS-14','ISSE - SIEM & Threat Detection','6 years','Secret','VA','Final Round']],pipelineCols:['ID','Current title','Exp.','Clearance','Region','Stage'],note:'Selected anonymized candidates from the supplied federal security tracker. Salaries, names, links and detailed notes are removed.'}

function footer(){return `<div class="footer"><div class="wrap"><div>Muhammad Danish · Talent Acquisition & Headhunting Partner</div><div>Portfolio evidence presented with candidate identities anonymized.</div></div></div>`}
function landing(){return `${nav()}<header class="landing-hero"><div class="wrap"><div class="eyebrow">Muhammad Danish · Recruitment Portfolio</div><h1>Choose the recruitment work most relevant to your search.</h1><p>Open the complete portfolio for the full body of work, or use a niche-specific link when you want to share only the most relevant case study with a client.</p></div></header><main class="portfolio-selector"><div class="wrap"><a class="portfolio-primary" href="/full-portfolio"><div><div class="eyebrow">Main Portfolio</div><h2>Complete Recruitment Portfolio</h2><p>Full overview of recruitment work, results, methodology, client feedback and all five case studies in one place.</p></div><div class="primary-side">Open complete portfolio</div></a><div class="selector-label">Niche-specific portfolio links</div><div class="selector-grid">${Object.values(DATA).map((d,i)=>`<a class="selector-card" href="/${d.slug}"><span>0${i+1} · Case Study</span><b>${d.title}</b><i>Open niche portfolio</i></a>`).join('')}</div></div></main>${footer()}`}
function fullCase(d,i){const extra=d.slug==='digital-agency'?`<div class="evidence-box"><h4>28 hires across 16 roles in eight months</h4><p>The O8 engagement covered web and product, growth and marketing, creative and content, plus client and operations hiring. Each family used different evidence signals instead of one generic screen.</p></div><div class="role-breakdown"><div class="role-family"><b>6</b><span>Web & Product hires</span></div><div class="role-family"><b>4</b><span>Growth & Marketing hires</span></div><div class="role-family"><b>10</b><span>Creative & Content hires</span></div><div class="role-family"><b>8</b><span>Client & Operations hires</span></div></div><div class="codebox">("Project Manager" OR "Digital Project Manager" OR "Project Delivery Lead")<br>AND ("web development" OR "digital agency")<br>AND ("Agile" OR "Scrum" OR "JIRA" OR "Asana")<br>AND ("stakeholder management" OR "client communication" OR "cross-functional coordination")</div><div class="workflow"><div><b>01 · Role brief</b><span>Map the evidence required before search.</span></div><div><b>02 · Initial screen</b><span>AI-assisted first-pass interview where used.</span></div><div><b>03 · Candidate record</b><span>Keep the trail organized in Notion.</span></div><div><b>04 · Final review</b><span>Role-specific conversation before recommendation.</span></div></div>`:d.slug==='healthcare'?`<a class="ats-link" href="https://danish-recruitment-ats.vercel.app/#healthcare" target="_blank" rel="noopener">Open live Healthcare ATS evidence</a><div class="disclaimer">Clinical portfolio evidence is presented carefully: candidate identities and contact details are removed, and presentation-adjusted sample stages are not represented here as recorded candidate decisions.</div>`:'';return `<article class="full-case" id="case-${d.slug}"><div class="wrap full-case-grid"><div><div class="full-case-kicker">0${i+1} · ${d.client}</div><h3>${d.title}</h3><p class="summary">${d.subtitle}</p><div class="mini-stats">${d.stats.map(s=>`<div class="mini-stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div><a class="ats-link" href="/${d.slug}">Open dedicated case study</a></div><div><div class="eyebrow" style="color:#4f8d7e">Hiring challenge</div><p style="font-size:18px;margin-top:10px">${d.challenge}</p><div class="steps">${d.steps.map((x,j)=>`<div class="step"><div class="n">0${j+1}</div><div><h4>${x[0]}</h4><p>${x[1]}</p></div></div>`).join('')}</div>${extra}</div></div></article>`}
function fullPortfolio(){return `${nav()}<header class="hero"><div class="wrap hero-grid"><div><div class="eyebrow">Talent Acquisition & Headhunting Partner</div><h1>Hard-to-fill roles need more than <em>a candidate list.</em></h1><p class="lead">I turn difficult searches into clear hiring decisions through targeted sourcing, evidence-led screening and organized candidate pipelines.</p><a class="backhome" href="/">Back to portfolio links</a></div><div class="hero-side"><h3>Complete portfolio</h3><div class="focus">${Object.values(DATA).map(d=>`<a href="#case-${d.slug}">${d.title}<span>View</span></a>`).join('')}</div></div></div></header><div class="metrics"><div class="wrap metrics-grid"><div class="metric"><b>5+</b><span>Years in talent acquisition</span></div><div class="metric"><b>7,000+</b><span>Candidates sourced</span></div><div class="metric"><b>400+</b><span>Hires supported</span></div></div></div><section><div class="wrap"><div class="section-head"><div><div class="eyebrow" style="color:#4f8d7e">Complete Body of Work</div><h2>Five hiring environments.<br>One evidence-led approach.</h2></div><p>This page brings the complete portfolio together. Each niche also has its own direct link for proposals where only the relevant work should be shown.</p></div></div></section>${Object.values(DATA).map((d,i)=>fullCase(d,i)).join('')}<section class="method"><div class="wrap method-grid"><div><div class="eyebrow" style="color:#4f8d7e">Recruiting Method</div><h2 style="font-family:Georgia,serif;font-size:44px;font-weight:500;line-height:1.08">A status tells you where.<br>A note should tell you why.</h2><p style="color:var(--muted)">The pipeline is useful only when the evidence behind the candidate is visible.</p></div><div class="method-list"><div class="method-item"><div class="n">01</div><div><h4>Map the requirement</h4><p>Turn the brief into explicit must-haves, role evidence and search signals.</p></div></div><div class="method-item"><div class="n">02</div><div><h4>Search the market</h4><p>Use titles, adjacent profiles, Boolean logic and context-specific sourcing.</p></div></div><div class="method-item"><div class="n">03</div><div><h4>Screen for evidence</h4><p>Read past keyword matches and establish what the candidate actually owned or delivered.</p></div></div><div class="method-item"><div class="n">04</div><div><h4>Make the handoff useful</h4><p>Give the client a concise fit note, open questions and the recommended next step.</p></div></div></div></div></section><section class="proof-band"><div class="wrap proof-grid"><div><div class="eyebrow">Public profile snapshot</div><h2>Recruitment proof beyond the case studies.</h2><p style="color:#aebdc2">Public profile evidence included in the portfolio review draft.</p></div><div class="proof-list"><div class="proof-item"><b>100%</b><span>Job Success</span></div><div class="proof-item"><b>Top Rated</b><span>Public profile status</span></div></div></div></section><section><div class="wrap"><div class="section-head"><div><div class="eyebrow" style="color:#4f8d7e">Client Perspective</div><h2>What clients say after the search.</h2></div></div><div class="cards"><div class="quote"><p>“Detail oriented and great communicator. We even evolved scope a bit and the work products exceeded expectations.”</p><small>Public client review · Clinician recruitment</small></div><div class="quote"><p>“Professional, responsive, and detail-oriented. Highly recommend.”</p><small>Public client review · IT recruiting work</small></div></div><div class="disclaimer">The portfolio uses anonymized candidate evidence. Where the source labels an approach as proposed or illustrative, it is presented as methodology rather than rewritten as a recorded candidate outcome.</div></div></section><section class="cta"><div class="wrap cta-box"><div><div class="eyebrow" style="color:#4f8d7e">Direct Share Links</div><h2>Send the complete portfolio or only the niche that matches the role.</h2></div><a class="btn" href="/">View portfolio links</a></div></section>${footer()}`}
function casePage(d){return `${nav()}<header class="page-hero"><div class="wrap"><div class="breadcrumbs"><a href="/full-portfolio">Full Portfolio</a> / ${d.title}</div><div class="page-hero-grid"><div><div class="eyebrow">${d.kicker} · ${d.client}</div><h1>${d.title}</h1><p class="lead">${d.subtitle}</p></div><div class="sidefacts">${d.facts.map(f=>`<div class="sidefact"><span>${f[0]}</span><b>${f[1]}</b></div>`).join('')}</div></div></div></header><div class="stat-strip"><div class="wrap stat-grid">${d.stats.map(s=>`<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('')}</div></div><section><div class="wrap case-grid"><aside class="case-aside"><div class="label">Hiring challenge</div><h3>${d.client}</h3><p>${d.challenge}</p><div class="role-chips">${d.roles.map(r=>`<span class="chip">${r}</span>`).join('')}</div></aside><div class="case-content"><div class="eyebrow" style="color:#4f8d7e">How the search was structured</div><h2>Fit is built from evidence, not titles alone.</h2><p>The workflow changes by role, but the principle stays consistent: define what good looks like, find the right market, verify the evidence and keep the client-facing pipeline clear.</p><div class="steps">${d.steps.map((s,i)=>`<div class="step"><div class="n">0${i+1}</div><div><h4>${s[0]}</h4><p>${s[1]}</p></div></div>`).join('')}</div></div></div></section><section class="pipeline"><div class="wrap"><div class="pipeline-head"><div><div class="eyebrow" style="color:#4f8d7e">Pipeline Evidence</div><h2>Selected anonymized candidate view</h2></div><p>Portfolio samples keep candidate identities and direct contact details private while preserving the evidence fields relevant to the search.</p></div><div class="table-wrap"><table><thead><tr>${d.pipelineCols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${d.pipeline.map(row=>`<tr>${row.map((v,i)=>`<td>${i===row.length-1?`<span class="pill">${v}</span>`:v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="note">${d.note}</div></div></section>${d.slug==='federal-defense'?`<section><div class="wrap"><div class="section-head"><div><div class="eyebrow" style="color:#4f8d7e">Decision Lens</div><h2>Three paths through one search.</h2></div><p>An illustrative evaluation model: advance when the evidence is ready, verify when a material fact remains open, and pass when the core role evidence is not there.</p></div><div class="decision"><div class="decision-card advance"><div class="eyebrow" style="color:#4f8d7e">01 / Advance</div><h4>Evidence is ready to discuss</h4><p>Eligibility aligned, role evidence established, strengths and risks explained.</p></div><div class="decision-card verify"><div class="eyebrow" style="color:#9a7d38">02 / Verify</div><h4>One fact remains unsettled</h4><p>Confirm the open eligibility or engineering question before submission.</p></div><div class="decision-card pass"><div class="eyebrow" style="color:#a85f58">03 / Pass</div><h4>The core match is not there</h4><p>Record the specific gap and do not advance the profile.</p></div></div></div></section>`:''}<section class="cta"><div class="wrap cta-box"><div><div class="eyebrow" style="color:#4f8d7e">Relevant Search</div><h2>Have a similar role to fill?</h2></div><a class="btn" href="/full-portfolio">View full portfolio</a></div></section>${footer()}`}
const path=location.pathname.replace(/^\/+|\/+$/g,'');document.getElementById('app').innerHTML=path==='full-portfolio'?fullPortfolio():(path&&bySlug[path]?casePage(bySlug[path]):landing());
</script>
</body>
</html>
